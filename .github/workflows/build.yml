name: Build and release ESP32 firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Set firmware version from tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          OTA_MQTT_HOST: ${{ secrets.OTA_MQTT_HOST }}
          OTA_MQTT_USERNAME: ${{ secrets.OTA_MQTT_USERNAME }}
          OTA_MQTT_PASSWORD: ${{ secrets.OTA_MQTT_PASSWORD }}
          OTA_MQTT_ROOT_CA_CERT: ${{ secrets.OTA_MQTT_ROOT_CA_CERT }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          if not version.startswith("v") or '"' in version or "\\" in version:
              raise SystemExit("Release tag must be a safe v-prefixed version")
          ca_cert = os.environ.get("OTA_MQTT_ROOT_CA_CERT", "").strip()
          if not ca_cert.startswith("-----BEGIN CERTIFICATE-----") or not ca_cert.endswith("-----END CERTIFICATE-----"):
              raise SystemExit("Set the GitHub Actions secret OTA_MQTT_ROOT_CA_CERT to the broker CA PEM")
          if ')OTA_CA"' in ca_cert:
              raise SystemExit("Broker CA PEM contains the reserved OTA_CA raw-string delimiter")
          broker_host = os.environ.get("OTA_MQTT_HOST") or "192.168.211.251"
          Path("include/app_version.h").write_text(
              "#pragma once\n#define APP_VERSION \"" + version + "\"\n",
              encoding="utf-8",
          )
          Path("ota_manifest.json").write_text(
              '{"ota_protocol":1,"version":"' + version + '",'
              '"board":"esp32doit-devkit-v1"}\n',
              encoding="utf-8",
          )
          secrets_header = "\n".join([
              "#pragma once",
              "#define OTA_MQTT_HOST " + json.dumps(broker_host),
              "#define OTA_MQTT_USERNAME " + json.dumps(os.environ.get("OTA_MQTT_USERNAME", "")),
              "#define OTA_MQTT_PASSWORD " + json.dumps(os.environ.get("OTA_MQTT_PASSWORD", "")),
              "#define OTA_MQTT_ROOT_CA_DEFINED 1",
          ]) + "\n"
          secrets_header += (
              'static const char OTA_MQTT_ROOT_CA[] = R"OTA_CA('
              + ca_cert
              + ')OTA_CA";\n'
          )
          Path("include/ota_secrets.h").write_text(secrets_header, encoding="utf-8")
          PY

      - name: Build firmware
        run: pio run -e doit_devkit_v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            .pio/build/doit_devkit_v1/firmware.bin
            ota_manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
